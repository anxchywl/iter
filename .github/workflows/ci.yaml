name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ github.event_name == 'schedule' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'schedule' || steps.filter.outputs.frontend == 'true' }}
      browser: ${{ github.event_name == 'schedule' || steps.filter.outputs.browser == 'true' }}
      ci: ${{ github.event_name == 'schedule' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        if: github.event_name != 'schedule'
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'compose.local.yaml'
              - 'compose.production.yaml'
              - 'scripts/verify.sh'
              - 'scripts/local-env.sh'
            frontend:
              - 'frontend/**'
            browser:
              - 'backend/**'
              - 'frontend/**'
              - 'compose.local.yaml'
              - 'scripts/local-env.sh'
              - 'scripts/local-seed.sh'
              - 'scripts/local-seed.py'
              - 'scripts/verify.sh'
            ci:
              - '.github/workflows/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'compose.local.yaml'
              - 'compose.production.yaml'

  security:
    name: Security and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror
        # images are pinned by digest, so the mirror can only serve identical content; misses fall back to Docker Hub
        run: |
          config=/etc/docker/daemon.json
          current=$(sudo cat "$config" 2>/dev/null || echo '{}')
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"], "debug": true}' | sudo tee "$config" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -q mirror.gcr.io
          echo "daemon config: $(sudo cat "$config")"
          docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
          for url in https://mirror.gcr.io/v2/ https://mirror.gcr.io/v2/library/postgres/manifests/sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull"; do
            curl -sS -o /dev/null -w "%{http_code} %{time_total}s %{remote_ip} $url\n" --max-time 20 -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" "$url" || echo "curl failed for $url"
          done
          echo "stored registry logins: $(jq -c '.auths // {} | keys' ~/.docker/config.json 2>/dev/null || echo none)"
          docker logout
          echo "after logout: $(jq -c '.auths // {} | keys' ~/.docker/config.json 2>/dev/null || echo none)"
          time docker pull -q postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f || true
          sudo journalctl -u docker --no-pager --since "-2min" | grep -iE "mirror|trying to pull|fallback|error|status" | tail -40 || true
      - name: Scan secrets and validate configuration
        env:
          CI: "true"
        run: ./scripts/verify.sh security
      - name: Show Docker daemon log
        if: failure()
        run: sudo journalctl -u docker --no-pager | grep -iE "mirror|trying to pull|fallback|error|registry" | tail -120

  backend:
    name: Backend and database
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror
        # images are pinned by digest, so the mirror can only serve identical content; misses fall back to Docker Hub
        run: |
          config=/etc/docker/daemon.json
          current=$(sudo cat "$config" 2>/dev/null || echo '{}')
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"], "debug": true}' | sudo tee "$config" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -q mirror.gcr.io
          echo "daemon config: $(sudo cat "$config")"
          docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
          for url in https://mirror.gcr.io/v2/ https://mirror.gcr.io/v2/library/postgres/manifests/sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull"; do
            curl -sS -o /dev/null -w "%{http_code} %{time_total}s %{remote_ip} $url\n" --max-time 20 -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" "$url" || echo "curl failed for $url"
          done
          echo "stored registry logins: $(jq -c '.auths // {} | keys' ~/.docker/config.json 2>/dev/null || echo none)"
          docker logout
          echo "after logout: $(jq -c '.auths // {} | keys' ~/.docker/config.json 2>/dev/null || echo none)"
          time docker pull -q postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f || true
          sudo journalctl -u docker --no-pager --since "-2min" | grep -iE "mirror|trying to pull|fallback|error|status" | tail -40 || true
      - name: Verify backend and database
        env:
          CI: "true"
        run: ./scripts/verify.sh backend
      - name: Show Docker daemon log
        if: failure()
        run: sudo journalctl -u docker --no-pager | grep -iE "mirror|trying to pull|fallback|error|registry" | tail -120

  frontend:
    name: Frontend quality and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        env:
          CI: "true"
        run: ./scripts/verify.sh frontend

  browser:
    name: Browser and stack integration
    needs: changes
    if: needs.changes.outputs.browser == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pull Docker Hub images through a mirror
        # images are pinned by digest, so the mirror can only serve identical content; misses fall back to Docker Hub
        run: |
          config=/etc/docker/daemon.json
          current=$(sudo cat "$config" 2>/dev/null || echo '{}')
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"], "debug": true}' | sudo tee "$config" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -q mirror.gcr.io
          echo "daemon config: $(sudo cat "$config")"
          docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
          for url in https://mirror.gcr.io/v2/ https://mirror.gcr.io/v2/library/postgres/manifests/sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull"; do
            curl -sS -o /dev/null -w "%{http_code} %{time_total}s %{remote_ip} $url\n" --max-time 20 -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" "$url" || echo "curl failed for $url"
          done
          echo "stored registry logins: $(jq -c '.auths // {} | keys' ~/.docker/config.json 2>/dev/null || echo none)"
          docker logout
          echo "after logout: $(jq -c '.auths // {} | keys' ~/.docker/config.json 2>/dev/null || echo none)"
          time docker pull -q postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f || true
          sudo journalctl -u docker --no-pager --since "-2min" | grep -iE "mirror|trying to pull|fallback|error|status" | tail -40 || true
      - name: Verify browser flows and local stack
        env:
          CI: "true"
        run: ./scripts/verify.sh browser
      - name: Show Docker daemon log
        if: failure()
        run: sudo journalctl -u docker --no-pager | grep -iE "mirror|trying to pull|fallback|error|registry" | tail -120

  verify:
    name: verify
    if: ${{ always() }}
    needs: [changes, security, backend, frontend, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification check
        env:
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule' }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule' }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'schedule' }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$SECURITY_RESULT" = success
          [[ "$BACKEND_REQUIRED" != true || "$BACKEND_RESULT" = success ]]
          [[ "$FRONTEND_REQUIRED" != true || "$FRONTEND_RESULT" = success ]]
          [[ "$BROWSER_REQUIRED" != true || "$BROWSER_RESULT" = success ]]
